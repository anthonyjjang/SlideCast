<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideNarrator - PPTX AI 영상 변환</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SlideNarrator ✨</h1>
            <p>PPTX 파일 하나로 AI 음성 나레이션 영상을 자동 생성합니다.</p>
        </header>

        <main>
            <div class="upload-area" id="upload-area">
                <input type="file" id="file-input" accept=".pptx" hidden>
                <div class="upload-content">
                    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <h3>PPTX 파일을 드래그하여 놓거나 클릭하여 업로드하세요</h3>
                    <p class="subtitle">슬라이드 노트가 발표 대본으로 자동 변환됩니다.</p>
                </div>
            </div>

            <div id="progress-container" class="hidden">
                <h3 id="progress-text">작업을 준비 중입니다...</h3>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>

            <div id="result-container" class="hidden">
                <h3>🎉 영상 생성이 완료되었습니다!</h3>
                <button id="download-btn" class="btn-primary">영상 다운로드 (MP4)</button>
            </div>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
